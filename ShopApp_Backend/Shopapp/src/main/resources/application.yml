server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopapp}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none  # khong de java tự động tạo bảng, cot, v.v (thay vào đó, sử dụng các cau lenh SQL để tạo bang, cot, v.v)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    default-locale: en
  # flyway
  # Duong dan toi thu muc chua cac script Flyway
  flyway:
    locations: classpath:/db/migration,classpath:/dev/db/migration
    # Phien ban baseline se = 1 va khong thuc hien bat ky thay doi nao trong DB
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      use-redis-cache: false # On off redis
      host: ${REDIS_HOST:localhost} # Default to 'localhost' if not provided
      port: ${REDIS_PORT:6379}
  kafka:
    client:
      dns:
        lookup: use_dns_cache
    bootstrap-servers: ${KAFKA_BROKER_SERVER:localhost}:${KAFKA_BROKER_PORT:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.type.mapping]": category:com.project.Shopapp.models.LoaiSanPham
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 133370523093-epia28hkbciv4hjus42mloobhlpmhlis.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:4200/auth/google/callback}" # sau khi user dang nhap google thanh cong
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            resource-server:
              opaque-token:
                introspection-uri: "https://googleapis.com"
          facebook:
            client-id: 732898582930279
            client-secret: ac80ca7926d7e4ad80cde597504094c8
            redirect-uri: "${FACEBOOK_REDIRECT_URI:http://localhost:4200/auth/facebook/callback}" # sau khi user dang nhap facebook thanh cong
            auth-uri: https://www.facebook.com/v23.0/dialog/oauth
            token-uri: https://graph.facebook.com/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture.type(large)
            resource-server:
              opaque-token:
                introspection-uri: "https://googleapis.com"
            scope:
              #- email
              - public_profile
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

api:
  prefix: /api/v1

jwt:
  expiration: 2592000 #30 days = 30d * 24h * 60m * 60s
  expiration-refresh-token: 5184000 #60 days = 60d * 24h * 60m * 60s
  secretKey: k91v0UiqsELb5S9c14/gtKvcs/gxCnD8CBXJHj41WlE=

########################################################################################################
#  Tạo secretKey này:                                                                                  #
#    - Mở Git Bash nhập                                                                                #
#                       "openssl rand -base64 32"                                                      #
#      enter, hệ thống sẽ tự random tạo cho mình một cái                                               #
########################################################################################################
#    - Chuyển 1 chuổi mã hóa theo Base64, ví dụ muốn chuyển chuỗi "ihaveadream" => Base64:             #
#    - Mở Git Bash nhập                                                                                #
#                       "echo -n "ihaveadream" | base64"                                               #
#        (Không xử dụng cách này vì có thể chuỗi không đủ độ dài >= 32 bytes tức là 256-bit trở lên)   #
########################################################################################################

logging:
  level:
    org:
      springframework.security: DEBUG
      flywaydb: DEBUG

# swagger-ui custom path
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  show-actuator: true

# health check
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: "health, info"

